<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>counter app</title>
    <link rel="stylesheet" href="/task3A/cstyle.css">
</head>
<body>
    <div class="container">
        <div class="counter">
            <h1>counter app</h1>
            <h2 id="counter">0</h2>
            <button id="decrease">-</button>
            <button id="increase">+</button>
            <button id="reset">Reset</button>
            <button id="plus5">+5</button>
            <button id="minus5">-5</button>
            <p id="status">Zero</p>
            <p>Highest score: <span id="highscore">0</span></p>
        </div>
    </div>

    <script src="/task3A/cont.js"></script>
</body>
</html>
