<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO LIST</title>
    <link rel="stylesheet" href="tostyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>
   <main class="App">
    <!----header---->
    <header class="app__header">
        <h1 class="app__title">Task Flow</h1>
        <p class="app__subtitle">Manage your tasks efficiently</p>
    </header>
    <!--add task section-->
    <section class="task-input">
        <div class="task-input__group">
            <input type="text"
            id="taskinput"
            class="task-input__field"
            placeholder="Add a new task..."
            autocomplete="off" />
            <button id="addTaskBtn" class=" btn btn--primary">AddTask
</button>
        </div>
    </section>
    <!---task controls-->
    <section class="search-section">

    <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search tasks...">

</section>

    <section class="task-controls">
        <div class="task-controls__filter">
            <button class="filter-btn  filter-btn--active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <div class="task-controls__stats">
            <span id="taskcounter">0 Tasks</span>
        </div>
    </section>
    <!--task List-->
    <section class="task-list">
        <ul id="tasklist" class="task-list__items">
            <!--task will be rendered here-->
        </ul>
        <div id="emptyState" class="empty-state">
    <h3>No Tasks Yet</h3>
    <p>Start by adding your first task.</p>
</div>
    </section>


   </main>
    

    <script src="to.js"></script>
</body>
</html>
